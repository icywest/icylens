[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "icylens-api"
version = "0.5.0"
description = "Backend API for the iCYLENS cybersecurity analysis platform"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "joblib>=1.5,<2.0",
    "numpy>=2.3,<3.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "scikit-learn>=1.7,<2.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2.0",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

[tool.setuptools.package-data]
"app.attack.data" = ["*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "contract: API request, response, and schema contract tests",
    "integration: tests that exercise assembled FastAPI components",
    "security: repository and configuration safety checks",
    "unit: isolated settings, schema, and utility tests",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
